# RecipeFix ideas for the lean lane (POC 1).
#
# An idea is the CONCEPT: question, pillar, the real proof it stands on, what
# each slide/beat must do, and where every number comes from. The model writes
# the words inside these constraints; code checks them (copyGate.ts).
#
# Sources: RecipeFix docs/marketing/CONTENT_PLAN_14_DAYS.md (ids I1–I15), the
# reconciled knowledge pack, and the stored real result. Ids keep the plan's
# numbering so a post traces back to its row.

product: recipefix
product_terms: [RecipeFix, "the app", Plus]
product_repo: /Users/isaacmineo/PROJECT_2025/recipe-fix
knowledge:
  # Reconciled pack (docs-only branch docs/marketing-knowledge-reconcile-20261026).
  ref: e756660ef6e26ff0f3a798fb6256934ef1d4ec95
  path: docs/marketing/knowledge
# Proof and photos are read at the commit production serves (bundle markers,
# 2026-10-26T19:24Z: 3f32680f tree). Identical blobs on origin/main 619c036a.
proof_commit: 3f32680f

ideas:
  - id: I5
    pillar: transformation
    series: "Before / After #1"
    format: ig_carousel
    platform: instagram
    canvas: { width: 1080, height: 1350 }
    question: "Changing an ingredient changes more than the ingredient list."
    audience: "Restriction cooks (dairy-free) and scalers; product.md §3 rows 1–2"
    proof:
      file: src/data/landingRealResult.ts
      export: LANDING_REAL_RESULT
    claim_ids: [proof.tikka_method_changes, core.rewrites_steps, core.reasons]
    link: "https://recipefix.app/original-recipes/chicken-tikka-masala?utm_source=instagram&utm_medium=social&utm_campaign=transformation&utm_content=I5-ig-carousel"
    never_show:
      - "1½ (14.5-oz) can crushed tomatoes"
    fact_sources:
      - id: scale
        statement: "4 → 6 servings is ×1.5, i.e. 50% more of each ingredient"
        source: "arithmetic on the stored output's originalServings 4 and servings 6"
      - id: broil_time
        statement: "8 to 10 minutes per sheet"
        source: "stored output steps[4].instruction"
      - id: reduce_time
        statement: "Start checking at 10 minutes; the step says 10 to 15 minutes"
        source: "stored output steps[3].updated_note and steps[3].instruction"
      - id: temp
        statement: "165°F (74°C) internal"
        source: "stored output steps[4].instruction, steps[5].instruction (USDA FSIS poultry minimum)"
      - id: original_broil
        statement: "As written: spread it on a foil-lined baking sheet. Broil for 8 to 10 minutes"
        source: "RecipeFix src/data/recipefixOriginals.ts @3f32680f, chicken-tikka-masala, 'Char the chicken'"
      - id: original_reduce
        statement: "As written: cook uncovered for 10 to 12 minutes, until the sauce leaves a trail"
        source: "RecipeFix src/data/recipefixOriginals.ts @3f32680f, chicken-tikka-masala, 'Make the sauce' step 3"
      - id: original_finish
        statement: "As written: stir the cream into the sauce. Simmer gently for 5 minutes"
        source: "RecipeFix src/data/recipefixOriginals.ts @3f32680f, chicken-tikka-masala, 'Finish' step 1"
    slides:
      - role: cover
        must: "Hook in ≤10 words that names the tension: the dairy swap was easy, the steps changed. Kicker names the dish, the diet and 4 → 6. The photo label must say it is the Original recipe's licensed stock photo, not the adapted dish."
      - role: swaps
        must: "The three real swaps, before → after, shortened faithfully from ingredients[1], [5], [15]. Headline says the list was the easy part."
        sources: ["ingredients[1]", "ingredients[5]", "ingredients[15]"]
      - role: method
        must: "Broiling: the instinct is 50% more chicken → 50% longer under the broiler. The rewrite: two batches, same 8 to 10 minutes each. Why: crowding costs the char."
        sources: ["steps[4].updated_note", "steps[4].instruction", "explanations[2]"]
      - role: method
        must: "Reducing the sauce: don't multiply the 10 to 15 minutes. A wider pan evaporates faster. Start checking at 10 minutes, go by the spoon trail."
        sources: ["steps[3].updated_note", "steps[3].instruction"]
      - role: method
        must: "The marinade: let excess coconut yogurt drip off so the coating chars rather than pools."
        sources: ["steps[4].updated_note", "steps[0].updated_note"]
      - role: method
        must: "The cream: whisk separated coconut cream smooth, keep the sauce at a gentle simmer, and check several pieces (165°F) rather than stretching the time."
        sources: ["steps[5].updated_note", "steps[5].instruction"]
      - role: proof
        must: "This is a real RecipeFix result: show the app's own changed-step note (screenshot). One-line recap a cook can save."
        sources: ["steps[4].updated_note"]

  - id: V1
    pillar: fix_it
    series: "Scale it up #1"
    format: short_video
    platform: tiktok
    variants: [tiktok, instagram_reels]
    canvas: { width: 1080, height: 1920 }
    target_seconds: [30, 45]
    question: "Scaling a recipe up: multiply the ingredients, not the cooking time."
    audience: "Scalers (scaling is the #1 transformation, 23 in 90 days: get_popular_transformations 2026-10-26)"
    proof:
      file: src/data/landingRealResult.ts
      export: LANDING_REAL_RESULT
    claim_ids: [proof.tikka_method_changes, core.rewrites_steps, core.scaling]
    never_show:
      - "1½ (14.5-oz) can crushed tomatoes"
    fact_sources:
      - id: scale
        statement: "4 → 6 servings is ×1.5, i.e. 50% more: 1½ lb chicken becomes 2¼ lb"
        source: "stored output ingredients[0] (original 1 1/2 lb, adapted 2¼ lb)"
      - id: broil_time
        statement: "8 to 10 minutes per sheet"
        source: "stored output steps[4].instruction"
      - id: reduce_time
        statement: "Start checking at 10 minutes"
        source: "stored output steps[3].updated_note"
    beats:
      - role: hook
        must: "First frame moves: 4 → 6 servings. Line: multiply the ingredients, not the minutes."
      - role: amounts
        must: "Amounts do scale: 1½ lb chicken → 2¼ lb (×1.5)."
      - role: broil
        must: "Broiling 50% more chicken? Not 50% longer. Two batches, same 8 to 10 minutes each."
      - role: reduce
        must: "Reducing the sauce in a wider pan goes faster. Start checking at 10 minutes, watch the spoon trail."
      - role: simmer
        must: "Coconut cream instead of dairy cream: gentle simmer."
      - role: proof
        must: "The real RecipeFix screen showing these step notes. Label: real result, captured Oct 21 2026; app screen, local build of the live UI."
      - role: close
        must: "Takeaway: batches, not minutes. Cues, not clocks."
