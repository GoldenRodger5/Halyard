# Food quiz fact bank — the ONLY source of quiz questions.
#
# Every fact was read on its source page on `verified` and the quote is what
# the page says. The video, carousel and captions are built from these fields
# deterministically: no model writes a quiz answer. Rules (knowledge pack
# no.safety): say "contains wheat", never "safe for celiacs"; no medical claims;
# the answer and the source are always in the post itself.
#
# `photo` names a RecipeFix Original whose licensed stock photo sits behind the
# question (docs/RECIPEFIX_ORIGINALS.md). It is mood, not a claim about the dish.

facts:
  - id: soy-sauce-wheat
    topic: gluten-free
    question: "Which one usually contains wheat?"
    options: ["Soy sauce", "Rice vinegar", "Maple syrup", "Corn tortillas"]
    correct: 0
    why: "Traditional soy sauce is brewed with wheat. Tamari made without wheat is the usual swap."
    source:
      name: "Celiac Disease Foundation"
      short: "Celiac Disease Foundation, Sources of Gluten"
      url: "https://celiac.org/gluten-free-living/what-is-gluten/sources-of-gluten/"
      quote: "Soy sauce (though tamari made without wheat is gluten-free)"
    verified: 2026-10-26
    photo: weeknight-vegetable-fried-rice
    tip: "Swap: tamari made without wheat, or a soy sauce labelled gluten-free."
    image: "a wok of colourful vegetable stir fry being tossed over a high flame"
    tie: "Gluten-free fried rice? RecipeFix swaps the soy sauce and rewrites the steps."
    caption: "Check the bottle before your next stir fry. Answer and source in the video."
    tags: [glutenfree, foodtok, cookingtips, recipefix]
    claims: [core.diets, core.rewrites_steps]

  - id: gluten-free-20ppm
    topic: gluten-free
    question: "A US gluten-free label allows how much gluten?"
    options: ["None at all", "Under 20 ppm", "Under 100 ppm", "Under 1%"]
    correct: 1
    why: "Gluten-free on a US label doesn't mean zero. The FDA rule caps it below 20 parts per million."
    source:
      name: "U.S. FDA"
      short: "FDA, Gluten-Free Labeling Q&A"
      url: "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/questions-and-answers-gluten-free-food-labeling-final-rule"
      quote: "any unavoidable presence of gluten in the food must be less than 20 ppm"
    verified: 2026-10-26
    photo: garlic-shrimp-spaghetti
    search: ["gluten free label", "gluten free ppm"]
    tip: "Gluten-free on a US label means under 20 ppm, not zero."
    image: "a pantry shelf of packaged pasta, crackers and cereal boxes, labels blurred and unreadable"
    tie: "Cooking gluten-free? RecipeFix rewrites your recipe, steps included."
    caption: "Gluten-free on a US label doesn't mean zero. Do you know the number? You get 5 seconds."
    tags: [glutenfree, foodlabels, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]

