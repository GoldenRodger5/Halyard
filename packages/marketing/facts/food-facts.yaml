    claims: [core.diets, core.rewrites_steps]

  - id: parmigiano-rennet
    topic: vegetarian
    question: "Is real Parmigiano Reggiano vegetarian?"
    options: ["Yes", "No", "Only when aged"]
    correct: 1
    why: "Its official production rules allow only calf rennet. Look for hard cheeses made with microbial or vegetable rennet."
    source:
      name: "Consorzio del Formaggio Parmigiano Reggiano, Production Standard (2025)"
      short: "Parmigiano Reggiano Consortium, Production Standard"
      url: "https://backend.parmigianoreggiano.com/uploads/disciplinare_PR_EN_clean_02072025_55f8b10686.pdf"
      quote: "Milk coagulation, obtained exclusively by the use of calf rennet, takes place in bell-shaped copper vats"
    verified: 2026-10-26
    photo: crispy-chicken-parmesan
    tip: "Look for hard cheese made with microbial or vegetable rennet."
    image: "a bowl of spaghetti with finely grated hard cheese falling on top"
    tie: "Cooking vegetarian? RecipeFix swaps the cheese and tells you why."
    caption: "This one surprises a lot of vegetarians. Answer and source in the video."
    tags: [vegetarian, cheese, foodtok, recipefix]
    claims: [core.diets, core.reasons]

  - id: alcohol-cooks-off
    topic: cooking-myths
    question: "Wine simmered in a sauce for 1 hour. How much alcohol is left?"
    options: ["None", "About 5%", "About 25%", "About 75%"]
    correct: 2
    why: "USDA measured about 25% left after an hour of simmering, and still about 5% after two and a half hours."
    source:
      name: "USDA Table of Nutrient Retention Factors, Release 6"
      short: "USDA Nutrient Retention Factors, Release 6"
      url: "https://www.ars.usda.gov/ARSUserFiles/80400525/Data/retn/retn06.pdf"
      quote: "ALC BEV,STIRRED,BKD/SIMMRD 1 HR … 25; ALC BEV,STIRRED,BKD/SIMMRD 2.5 HR … 5"
    verified: 2026-10-26
    photo: creamy-tuscan-chicken
