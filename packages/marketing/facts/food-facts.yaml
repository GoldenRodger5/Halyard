    tip: "Swap: maple syrup."
    image: "a stack of pancakes with golden syrup being poured over the top"
    tie: "Making it vegan? RecipeFix swaps the honey and rewrites the steps."
    caption: "Quick one for anyone new to vegan cooking. Answer and source in the video."
