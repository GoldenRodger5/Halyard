  # ── Kitchen math (USDA FNS Food Buying Guide, Table 12) ──
  - id: km-tsp-tbsp
    topic: kitchen-math
    question: "How many teaspoons are in one tablespoon?"
    options: ["2", "3", "4", "5"]
    correct: 1
    why: "1 tablespoon is 3 teaspoons, or half a fluid ounce."
    source: &usda12
      name: "USDA Food Buying Guide, Table 12"
      short: "USDA Food Buying Guide, Volume Equivalents"
      url: "https://foodbuyingguide.fns.usda.gov/Content/TablesFBG/Table12_FBG_A_Guide_to_Volume_Equivalents_for_Liquids.pdf"
      quote: "1 tablespoon = 3 teaspoons = 0.5 fluid ounce; 1/4 cup = 4 tablespoons; 1/3 cup = 5 1/3 tablespoons; 1 cup = 16 tablespoons"
    verified: 2026-10-26
    photo: classic-banana-bread
    tip: "1 tablespoon = 3 teaspoons."
    image: "a set of metal measuring spoons, a teaspoon and a tablespoon filled with sugar, on a floured counter"
    tie: &kmtie "Scaling a recipe? RecipeFix does the math in measurements you can actually use."
    caption: "Kitchen math, round one. 5 seconds."
    tags: [cookingtips, bakingtips, foodtok, recipefix]
    claims: [core.scaling]

  - id: km-quarter-cup
    topic: kitchen-math
    question: "No 1/4 cup measure. How many tablespoons do you use?"
    options: ["2", "3", "4", "6"]
    correct: 2
    why: "A quarter cup is 4 tablespoons. A full cup is 16."
    source: *usda12
    verified: 2026-10-26
    photo: fluffy-buttermilk-pancakes
    tip: "1/4 cup = 4 tablespoons."
    image: "measuring cups and a tablespoon on a floured baking counter, a quarter-cup measure in front"
    tie: *kmtie
    caption: "Lost your quarter cup? You only need a tablespoon."
    tags: [cookingtips, bakingtips, foodtok, recipefix]
    claims: [core.scaling]

  - id: km-third-cup
    topic: kitchen-math
    question: "How many tablespoons are in 1/3 cup?"
    options: ["4", "5", "5 and 1/3", "6"]
    correct: 2
    why: "One third of 16 tablespoons is 5 and 1/3: that's 5 tablespoons plus 1 teaspoon."
    source: *usda12
    verified: 2026-10-26
    photo: blueberry-banana-french-toast
    tip: "1/3 cup = 5 tablespoons + 1 teaspoon."
    image: "a one-third cup measuring cup filled with flour beside a tablespoon on a baking counter"
