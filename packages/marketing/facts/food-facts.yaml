  - id: honey-vegan
    topic: vegan
    question: "Is honey vegan?"
    options: ["Yes", "No", "Only raw honey"]
    correct: 1
    why: "The Vegan Society lists honey with meat, dairy and eggs as foods vegans avoid. Maple syrup is the easy swap."
    source:
      name: "The Vegan Society"
      short: "The Vegan Society, Definition of veganism"
      url: "https://www.vegansociety.com/go-vegan/definition-veganism"
      quote: "avoiding all animal foods such as meat (including fish, shellfish and insects), dairy, eggs and honey"
    verified: 2026-10-26
