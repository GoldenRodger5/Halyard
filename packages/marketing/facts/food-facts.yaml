  # ── Food history ──
  - id: hist-tomato
    topic: food-history
    question: "In 1893 the US Supreme Court ruled a tomato is a…"
    options: ["Fruit", "Vegetable", "Berry"]
    correct: 1
    why: "In Nix v. Hedden the Court called it a vegetable for tariffs, because it's served with dinner, not as dessert."
    source:
      name: "Nix v. Hedden, 149 U.S. 304 (1893)"
      short: "Nix v. Hedden, 149 U.S. 304 (1893)"
      url: "https://www.law.cornell.edu/supremecourt/text/149/304"
      quote: "usually served at dinner in, with, or after the soup, fish, or meats which constitute the principal part of the repast, and not, like fruits generally, as dessert"
    verified: 2026-10-26
    photo: creamy-tuscan-chicken
    search: ["is a tomato a fruit or vegetable", "tomato supreme court"]
    tip: "Botanically a fruit. Legally a vegetable since 1893."
    image: "ripe red tomatoes on the vine on an old wooden table in warm light"
    tie: &histtie "Cooking it your way tonight? RecipeFix rewrites the recipe, steps included."
    caption: "Botanists and the Supreme Court disagree on this one."
    tags: [foodhistory, foodfacts, foodtok, recipefix]
    claims: [core.rewrites_steps]

