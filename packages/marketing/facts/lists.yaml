# List videos: a bold claim over a mosaic of the items, then one sourced item
# every ~2 s, each with a stamp that reveals what is hidden in it, then a recap.
#
# "Things you didn't know contain X" is one of the most proven food formats on
# TikTok. Every item points at a fact in food-facts.yaml; its source is that
# fact's source. `stamp` and `line` must say nothing the fact's `why` does not.
# The closing checklist shows each item with its stamp. A line names the swap
# when the source gives one: a warning alone is not worth saving.
# `image` shows the item itself (a list has no answer to spoil), and must suit
# the audience: no meat on a vegan list.

lists:
  not-vegan:
    series: "Not vegan"
    topic: vegan
    hook: "Looks vegan? Check these 5."
    hook_image: "a cozy mug of hot chocolate topped with toasted marshmallows on a wooden table, warm daylight"
    save: "Screenshot this for the store."
    tie: "Making it vegan? RecipeFix swaps these and rewrites the steps."
    search: ["what foods are not vegan", "surprising non vegan foods"]
    caption: "Send this to someone who just went vegan."
    tags: [vegan, veganswaps, vegantok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    items:
      - fact: vegan-carmine
        name: "Red food dye E120"
        stamp: "Insects"
        line: "E120, or carmine, comes from crushed insects. Beet or paprika color is the swap."
        image: "a plate of bright red frosted cupcakes and candy on a kitchen table"
      - fact: veg-marshmallow
        name: "Marshmallows"
        stamp: "Gelatin"
        line: "Classic ones are set with gelatin. Vegan ones use plant gels."
        image: "a bowl of white marshmallows next to a mug of hot chocolate"
      - fact: label-worcestershire
        name: "Worcestershire sauce"
        stamp: "Anchovies"
        line: "The classic recipe is made with anchovies. Vegan versions exist."
        image: "a Bloody Mary cocktail with a celery stick next to a small glass bottle of dark Worcestershire sauce with no label"
      - fact: veg-isinglass
        name: "Some beer and wine"
        stamp: "Isinglass"
        line: "Made from fish bladders, it clarifies some of them. Vegan-labelled bottles skip it."
        image: "a glass of beer and a glass of white wine on a wooden bar counter"
      - fact: parmigiano-rennet
        name: "Parmigiano Reggiano"
        stamp: "Calf rennet"
        line: "Its official rules call for it. Look for microbial rennet instead."
        image: "a chunk of aged parmesan cheese with a small cheese knife on a board"

  hidden-gluten:
    series: "Hidden gluten"
    topic: gluten-free
    hook: "Gluten-free? Check these 5"
    hook_image: "a pantry shelf with a bottle of soy sauce, a bottle of malt vinegar, a jar of gravy granules and a rustic loaf of bread, bright daylight"
    save: "Screenshot this for the store."
    tie: "Cooking gluten-free? RecipeFix rewrites your recipe, steps included."
    search: ["hidden gluten foods", "foods with hidden gluten"]
    caption: "Send this to someone who cooks gluten-free."
    tags: [glutenfree, glutenfreetips, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    twist:
      fact: myth-quinoa-gf
      name: "Quinoa"
      stamp: "Gluten-free"
      line: "Naturally gluten-free. Still check the label for cross-contact."
      image: "a bowl of cooked quinoa salad with vegetables on a kitchen counter"
    items:
      - fact: soy-sauce-wheat
        name: "Soy sauce"
        stamp: "Wheat"
        line: "Traditionally brewed with wheat. Tamari made without wheat is the swap."
        image: "a bottle of dark soy sauce being poured into a small dish beside a vegetable stir fry"
      - fact: gf-malt-vinegar
        name: "Malt vinegar"
        stamp: "Malt"
        line: "Malt is a gluten source, and that includes malt vinegar."
        image: "a bottle of malt vinegar next to a basket of fish and chips"
      - fact: gf-gravy
        name: "Gravy"
        stamp: "Wheat flour"
        line: "Many gravies are thickened with it."
        image: "a gravy boat of brown gravy pouring over mashed potatoes"
      - fact: myth-wheat-free
        name: "\"Wheat-free\" labels"
        stamp: "Rye, barley"
        line: "Wheat-free can still mean rye or barley. Look for the words gluten-free."
        image: "bowls of whole rye grains and pearl barley on a wooden kitchen table"
      - fact: label-cream-mushroom
        name: "Canned cream of mushroom"
        stamp: "Wheat flour"
        line: "Campbell's classic condensed can lists it."
        image: "a green bean casserole in a baking dish with crispy onions on top"

  hidden-dairy:
    series: "Hidden dairy"
    topic: allergies
    hook: "Dairy-free? Milk hides in these 5"
    hook_sub: "#5 is at the steakhouse"
    hook_image: "grilled hot dogs in buns and a bowl of tuna salad on a sunny picnic table"
    save: "Screenshot this for the store."
    tie: "Cooking dairy-free? RecipeFix swaps the dairy and rewrites the steps."
    search: ["hidden dairy ingredients", "foods with hidden dairy"]
    caption: "None of these say milk on the front. Send this to someone who cooks dairy-free."
    tags: [dairyfree, foodallergies, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    items:
      - fact: myth-nondairy
        name: "\"Nondairy\" creamer"
        stamp: "Caseinate"
        line: "US rules let a nondairy label contain this milk protein."
        image: "coffee creamer being poured into a mug of black coffee"
      - fact: allergen-hotdog-casein
        name: "Hot dogs and sausages"
        stamp: "Casein"
        line: "Some use this milk protein as a binder. Check the package."
        image: "grilled hot dogs and sausages on a grill with tongs"
      - fact: allergen-tuna-casein
        name: "Canned tuna"
        stamp: "Some brands"
        line: "A few add casein, a milk protein. Check the can."
        image: "an open can of tuna next to a bowl of tuna salad on a kitchen counter"
      - fact: allergen-shellfish-milk
        name: "Shellfish"
        stamp: "Milk dip"
        line: "Sometimes dipped in milk to cut the fishy smell. Ask when you buy."
        image: "raw shrimp on ice at a seafood counter"
      - fact: allergen-steak-butter
        name: "Restaurant steak"
        stamp: "Butter"
        line: "Many kitchens finish it with butter, and it melts out of sight. Ask for none."
        image: "a sliced grilled steak on a wooden board in a restaurant kitchen"
