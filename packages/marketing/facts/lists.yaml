# List videos: a bold claim over a mosaic of the items, then one sourced item
# every ~2 s, each with a stamp that reveals what is hidden in it, then a recap.
#
# "Things you didn't know contain X" is one of the most proven food formats on
# TikTok. Every item points at a fact in food-facts.yaml; its source is that
# fact's source. `stamp` and `line` must say nothing the fact's `why` does not.
# The closing checklist shows each item with its stamp. A line names the swap
# when the source gives one: a warning alone is not worth saving.
# `kind: swaps` makes every stamp a good thing (green, ticked) rather than a warning.
# `image` shows the item itself (a list has no answer to spoil), and must suit
# the audience: no meat on a vegan list.

lists:
  not-vegan:
    series: "Not vegan"
    topic: vegan
    hook: "5 sneaky non-vegan ingredients to check for"
    hook_image: "a plate of bright red frosted cupcakes on a sunny kitchen table"
    save: "Save this for your next grocery run."
    tie: "Making it vegan? RecipeFix swaps these and rewrites the steps."
    search: ["what foods are not vegan", "surprising non vegan foods"]
    caption: "Send this to someone who just went vegan."
    tags: [vegan, veganswaps, vegantok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    items:
      - fact: vegan-carmine
        name: "Red food dye E120"
        stamp: "Insects"
        line: "Check red foods for E120, or carmine, made from insects. Beet color is the swap."
        image: "a plate of bright red frosted cupcakes and candy on a kitchen table"
      - fact: veg-marshmallow
        name: "Marshmallows"
        stamp: "Gelatin"
        line: "Classic ones are set with gelatin. Vegan ones use plant gels."
        image: "a bowl of white marshmallows next to a mug of hot chocolate"
      - fact: label-worcestershire
        name: "Worcestershire sauce"
        stamp: "Anchovies"
        line: "The classic recipe is made with anchovies. Vegan versions exist."
        image: "a Bloody Mary cocktail with a celery stick next to a small glass bottle of dark Worcestershire sauce with no label"
      - fact: veg-isinglass
        name: "Some beer and wine"
        stamp: "Isinglass"
        line: "Made from fish bladders, it clarifies some of them. Vegan-labelled bottles skip it."
        image: "a glass of beer and a glass of white wine on a wooden bar counter"
      - fact: parmigiano-rennet
        name: "Parmigiano Reggiano"
        stamp: "Calf rennet"
        line: "Its official rules call for it. Look for microbial rennet instead."
        image: "a chunk of aged parmesan cheese with a small cheese knife on a board"

  hidden-gluten:
    series: "Hidden gluten"
    note: "Recipes and brands vary. Check labels for the words gluten-free."
    topic: gluten-free
    hook: "5 foods that can secretly contain gluten"
    hook_image: "a pantry shelf with a bottle of soy sauce, a bottle of malt vinegar, a jar of gravy granules and a rustic loaf of bread, bright daylight"
    save: "Save this for your next grocery run."
    tie: "Cooking gluten-free? RecipeFix rewrites your recipe, steps included."
    search: ["hidden gluten foods", "foods with hidden gluten"]
    caption: "Send this to someone who cooks gluten-free."
    tags: [glutenfree, glutenfreetips, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    twist:
      fact: myth-quinoa-gf
      name: "Quinoa"
      stamp: "Gluten-free"
      line: "Naturally gluten-free. Still check the label for cross-contact."
      image: "a bowl of cooked quinoa salad with vegetables on a kitchen counter"
    items:
      - fact: soy-sauce-wheat
        name: "Soy sauce"
        stamp: "Wheat"
        line: "Traditionally brewed with wheat. Tamari labelled gluten-free is the swap."
        image: "a bottle of dark soy sauce being poured into a small dish beside a vegetable stir fry"
      - fact: gf-malt-vinegar
        name: "Malt vinegar"
        stamp: "Malt"
        line: "Malt is a gluten source, and that includes malt vinegar."
        image: "a bottle of malt vinegar next to a basket of fish and chips"
      - fact: gf-gravy
        name: "Gravy"
        stamp: "Wheat flour"
        line: "Many gravies are thickened with it."
        image: "a gravy boat of brown gravy pouring over mashed potatoes"
      - fact: myth-wheat-free
        name: "\"Wheat-free\" labels"
        stamp: "Rye, barley"
        highlight: "rye, or barley"
        line: "Wheat-free can still mean rye or barley. Look for the words gluten-free."
        image: "bowls of whole rye grains and pearl barley on a wooden kitchen table"
      - fact: label-cream-mushroom
        name: "Canned cream of mushroom"
        stamp: "Wheat flour"
        line: "Campbell's classic condensed can lists it."
        image: "a green bean casserole in a baking dish with crispy onions on top"

  hidden-dairy:
    series: "Dairy allergy check"
    note: "Ingredients vary by brand and kitchen. Check labels and ask staff."
    topic: allergies
    hook: "Dairy-free? Milk can hide in these 5"
    hook_sub: "#5 is at the steakhouse"
    hook_image: "a close-up of one grilled hot dog in a bun with mustard, shallow depth of field, bright daylight"
    save: "Save this for your next grocery run."
    tie: "Cooking dairy-free? RecipeFix swaps the dairy and rewrites the steps."
    search: ["hidden dairy ingredients", "foods with hidden dairy"]
    caption: "Send this to someone who cooks dairy-free."
    tags: [dairyfree, foodallergies, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    items:
      - fact: myth-nondairy
        name: "\"Nondairy\" creamer"
        stamp: "Caseinate"
        line: "US rules let a nondairy label contain this milk protein."
        image: "coffee creamer being poured into a mug of black coffee"
      - fact: allergen-hotdog-casein
        name: "Hot dogs and sausages"
        stamp: "Casein"
        line: "Some use this milk protein as a binder. Check the package."
        image: "grilled hot dogs and sausages on a grill with tongs"
      - fact: allergen-tuna-casein
        name: "Canned tuna"
        stamp: "Some brands"
        line: "A few add casein, a milk protein. Check the can."
        image: "an open can of tuna next to a bowl of tuna salad on a kitchen counter"
      - fact: allergen-shellfish-milk
        name: "Shellfish"
        stamp: "Dipped in milk"
        highlight: "dipped in milk"
        line: "Sometimes dipped in milk to cut the fishy smell. Ask when you buy."
        image: "raw shrimp on ice at a seafood counter"
      - fact: allergen-steak-butter
        name: "Restaurant steak"
        stamp: "Butter"
        line: "Many kitchens finish it with butter, and it melts out of sight. Ask for none."
        image: "a sliced grilled steak on a wooden board in a restaurant kitchen"

  check-halal:
    series: "Halal kitchen"
    topic: halal
    hook: "Cooking halal? Check these 5"
    hook_sub: "#4 is in this pot"
    hook_image: "a pot of creamy pasta sauce simmering on a stove with an open bottle of white wine beside it, warm kitchen light"
    save: "Save this for your next grocery run."
    tie: "Cooking halal? RecipeFix swaps these and rewrites the steps."
    search: ["is vanilla extract halal", "does alcohol cook off"]
    caption: "Send this to someone who cooks halal."
    tags: [halal, halalfood, foodtok, recipefix]
    claims: [core.diets, core.rewrites_steps]
    items:
      - fact: halal-lard
        name: "Pie crust"
        stamp: "Lard"
        line: "Some recipes use it, and US rules define lard as pork fat."
        image: "a homemade pie with a flaky golden crust on a kitchen counter"
      - fact: halal-gelatin
        name: "Gummy candy"
        stamp: "Gelatin"
        line: "US rules define it as made from cattle and pig parts. Agar-agar is the swap."
        image: "a bowl of colorful gummy bears on a kitchen table"
      - fact: halal-vanilla
        name: "Vanilla extract"
        stamp: "35% alcohol"
        highlight: "not less than 35 percent"
        line: "That's the US minimum. Vanilla flavoring has less, which is not none."
        image: "a small brown bottle of vanilla extract with vanilla beans on a baking counter"
      - fact: alcohol-cooks-off
        name: "Wine in the sauce"
        stamp: "25% stays"
        highlight: "1 HR … 25"
        line: "USDA measured about a quarter of the alcohol left after an hour of simmering."
        image: "white wine being poured into a pan of sauce on a stove"
      - fact: flambe-alcohol
        name: "Flambé"
        stamp: "75% stays"
        highlight: "FLAMED … 75"
        line: "USDA found only about a quarter burns off in the flames."
        image: "a pan of shrimp flaming on a gas stove in a home kitchen"

  kitchen-rules-wrong:
    series: "Kitchen myths"
    close_title: "The real numbers"
    topic: cooking-myths
    hook: "5 kitchen rules that are wrong"
    hook_sub: "Measured, not guessed"
    hook_image: "a home cook stirring a pot of sauce on a stove with measuring cups and a bag of flour on the counter"
    save: "Screenshot this for later."
    tie: "Cooking it your way tonight? RecipeFix rewrites the recipe, steps included."
    search: ["does alcohol cook off", "cooking myths debunked"]
    caption: "Which one did you grow up with? Sources in the video."
    tags: [cookingtips, kitchenmyths, foodtok, recipefix]
    claims: [core.rewrites_steps]
    items:
      - fact: alcohol-cooks-off
        name: "\"The alcohol cooks off\""
        stamp: "25% after 1 hr"
        highlight: "1 HR … 25"
        line: "USDA measured about a quarter still there after an hour of simmering."
        image: "red wine being poured into a pot of stew on a stove"
      - fact: flambe-alcohol
        name: "\"Flambé burns it off\""
        stamp: "75% stays"
        highlight: "FLAMED … 75"
        line: "USDA found only about a quarter burns off in the flames."
        image: "a pan flaming on a gas stove in a home kitchen"
      - fact: myth-flour-sugar
        name: "\"A cup is a cup\""
        stamp: "120 g vs 198 g"
        highlight: "120 grams"
        line: "King Arthur's chart: a cup of flour against a cup of sugar."
        image: "a cup of flour and a cup of sugar side by side on a kitchen scale"
      - fact: myth-altitude
        name: "\"Water boils at 212°F\""
        stamp: "202°F at 5,000 ft"
        highlight: "boils at 202°F"
        line: "About 10° lower up high, so boiled food takes longer."
        image: "a pot of water at a rolling boil on a stove with mountains through the kitchen window"
      - fact: myth-wheat-free
        name: "\"Wheat-free is gluten-free\""
        stamp: "Rye, barley"
        highlight: "rye, or barley"
        line: "Wheat-free can still mean rye or barley. Look for the words gluten-free."
        image: "bowls of whole rye grains and pearl barley on a wooden kitchen table"

  swaps-that-work:
    series: "Swaps that work"
    kind: swaps
    topic: baking
    hook: "Out of eggs or milk? 5 swaps that work"
    hook_image: "a baking counter with a bowl of batter, a can of chickpeas, a jar of flax meal and a carton of soy milk, bright daylight"
    save: "Screenshot this for your next bake."
    tie: "Baking around eggs or dairy? RecipeFix rewrites the recipe, steps included."
    search: ["egg substitute for baking", "dairy free buttermilk substitute"]
    caption: "Which one are you trying first? Sources in the video."
    tags: [bakingtips, bakinghacks, foodtok, recipefix]
    claims: [core.rewrites_steps]
    items:
      - fact: bake-aquafaba
        name: "Egg whites"
        stamp: "Aquafaba"
        line: "The chickpea liquid whips like whites. 1/4 cup per egg."
        image: "a glass bowl of glossy whipped aquafaba with a whisk next to an open can of chickpeas"
      - fact: bake-flax-egg
        name: "One egg, for binding"
        stamp: "Flax egg"
        highlight: "1 tablespoon flax meal"
        line: "1 tbsp flax meal plus 3 tbsp water, 5 to 10 minutes. It binds, it won't fluff."
        image: "a small bowl of flax meal mixed with water and a spoon on a baking counter"
      - fact: km-buttermilk-df
        name: "Buttermilk"
        stamp: "Lemon + milk"
        highlight: "1 tablespoon lemon juice or vinegar"
        line: "1 tbsp lemon juice or vinegar in 1 cup non-dairy milk. Rest 5 minutes."
        image: "a measuring cup of plant milk with a halved lemon beside it"
      - fact: protein-soy-milk
        name: "Milk in a bake"
        stamp: "Soy milk"
        line: "Same 8 g protein per cup as dairy milk, King Arthur's top pick."
        image: "a carton of soy milk being poured into a mixing bowl of batter"
      - fact: vegan-nooch
        name: "Cheesy flavor"
        stamp: "Nutritional yeast"
        line: "The Vegan Society's pick for a cheesy taste without cheese."
        image: "a bowl of nutritional yeast flakes next to a bowl of pasta"
