# ═══════════════════════════════════════════════════════════════════════════
# CI from the first commit.
#
# The product this markets has no CI, and it cost sixteen days of silent
# production drift. Typecheck, lint and test on every push, and block merge on
# failure.
#
# The database job is the important one: publish idempotency, SKIP LOCKED, RLS
# and the AI-disclosure constraint only exist in Postgres, so CI runs a real one.
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret. CI runs against a throwaway Postgres in a container.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  TOKEN_ENCRYPTION_KEY: dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktdGVzdA==
  # §564. A database-backed suite may not skip here. Forty-three suites guard on
  # `databaseAvailable()` and report GREEN when it returns false — so a CI run
  # whose Postgres service failed to come up looked exactly like a clean one.
  # With this set they fail with the reason instead.
  HALYARD_REQUIRE_DB: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # No `version:` here. package.json pins `packageManager: pnpm@11.21.0`,
      # and pnpm/action-setup@v4 fails outright when both are specified rather
      # than preferring one — so the manifest is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The audio, tts, review-media and render tests shell out to ffmpeg and
      # ffprobe. Without them five test files fail with `spawn ffmpeg ENOENT`,
      # which was invisible while Actions was billing-locked. Installing the
      # binary is the honest fix — skipping those tests when it is absent would
      # make coverage a property of the runner image.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The Explorer's replay tests drive a real browser: `verifyFeature.test.ts`
      # calls `chromium.launch()` directly, so the verify job needs the browser
      # as well as ffmpeg. Driving a real browser is the point of those tests —
      # a stubbed Playwright would prove only that the code calls the functions
      # it calls.
      - name: Install the browser for the replay tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations to a real Postgres
        run: pnpm db:reset -- --fresh --seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Generated types are current
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/types.gen.ts \
            || (echo "::error::packages/db/src/types.gen.ts is stale. Run pnpm db:types and commit." && exit 1)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # §564. `if: !cancelled()` on every check from here down.
      #
      # The generated-types step above has been failing since 2 September, and
      # because a failed step ends the job, typecheck, lint and tests DID NOT
      # RUN AT ALL for four days. One known-red step was hiding the state of
      # three others — and when the types were finally fixed, lint turned out to
      # have seven errors of its own. Every check now reports its own verdict,
      # and the job still fails if any of them did.
      - name: Typecheck
        if: '!cancelled()'
        run: |
          for dir in packages/core packages/db packages/render packages/ui packages/audit apps/worker apps/web; do
            echo "── $dir"
            (cd "$dir" && pnpm exec tsc --noEmit)
          done

      - name: Lint
        if: '!cancelled()'
        run: pnpm exec eslint .

      - name: Test
        if: '!cancelled()'
        # gotcha 12: forty-three suites each create and migrate a database, and
        # the default worker count exhausts Postgres. minWorkers is not
        # decoration — maxWorkers alone reports "no tests" with a zero exit.
        run: pnpm exec vitest run --minWorkers=1 --maxWorkers=4

  # ── End to end ───────────────────────────────────────────────────────────
  #
  # Separate from `verify` because it needs a browser and a running app, and
  # because it catches a different class of defect. The launch-batch replan bug
  # is the example: the planner's unit tests were all correct and the planner
  # was being handed the wrong input, which only a real click could show.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The E2E suite drives the dashboard, which is behind an operator gate.
      # Refused in production by the auth module itself, not by convention.
      HALYARD_DEV_UNAUTHENTICATED: '1'

    steps:
      - uses: actions/checkout@v4
      # No `version:` here. package.json pins `packageManager: pnpm@11.21.0`,
      # and pnpm/action-setup@v4 fails outright when both are specified rather
      # than preferring one — so the manifest is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed
        run: pnpm db:reset -- --fresh --seed

      - name: Install the browser
        # Both browsers: the `desktop` project is Chromium and the `mobile`
        # project is an iPhone 14, which Playwright drives with WebKit. Only
        # chromium was installed, so every mobile test failed on a missing
        # executable rather than on anything about the app.
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `version:` here. package.json pins `packageManager: pnpm@11.21.0`,
      # and pnpm/action-setup@v4 fails outright when both are specified rather
      # than preferring one — so the manifest is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @halyard/web build
        env:
          # The build must not require a live database or any platform secret.
          NEXT_TELEMETRY_DISABLED: '1'
